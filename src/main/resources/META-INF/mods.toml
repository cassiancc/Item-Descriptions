modLoader = "javafml"
loaderVersion = "[43,)"
license = "MIT"

[[mods]]
modId = "item_descriptions"
version = "${version}"
displayName = "Item Descriptions"
authors = "cassiancc"
description = '''
This mod adds unique descriptions for all blocks, items, enchantments, effects, and mobs - built in a way that makes it easy to add modded content.
'''
logoFile = "icon.png"
issueTrackerURL = "https://github.com/cassiancc/Item-Descriptions/issues"
displayURL="https://moddedmc.wiki/en/project/item-descriptions/"
modURL="https://moddedmc.wiki/en/project/item-descriptions/"


[[dependencies.item_descriptions]]
modId = "forge"
mandatory = true
versionRange = "[43,50)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.item_descriptions]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "CLIENT"